---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8scan
  namespace: k8scan
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8scan-reader
rules:
  # Core v1 — cluster-wide read
  - apiGroups: [""]
    resources:
      - pods
      - secrets
      - configmaps
      - services
      - namespaces
      - serviceaccounts
      - endpoints
      - resourcequotas
      - limitranges
      - nodes
    verbs: ["get", "list"]
  # Apps v1
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs: ["get", "list"]
  # RBAC v1
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - clusterroles
      - rolebindings
      - clusterrolebindings
    verbs: ["get", "list"]
  # Networking v1
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
      - ingresses
    verbs: ["get", "list"]
  # Batch v1
  - apiGroups: ["batch"]
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list"]
  # Admission v1
  - apiGroups: ["admissionregistration.k8s.io"]
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs: ["get", "list"]
  # Policy v1
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list"]
  # Autoscaling v2
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8scan-reader
subjects:
  - kind: ServiceAccount
    name: k8scan
    namespace: k8scan
roleRef:
  kind: ClusterRole
  name: k8scan-reader
  apiGroup: rbac.authorization.k8s.io
