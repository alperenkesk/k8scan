---
apiVersion: v1
kind: Namespace
metadata:
  name: k8scan
---
# One-shot scan Job — writes JSON report to /reports volume
apiVersion: batch/v1
kind: Job
metadata:
  name: k8scan
  namespace: k8scan
  labels:
    app.kubernetes.io/name: k8scan
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8scan
    spec:
      serviceAccountName: k8scan
      restartPolicy: Never
      containers:
        - name: k8scan
          image: ghcr.io/alperenkeskin/k8scan:latest
          args:
            - scan
            - --output-json=/reports/k8scan-report.json
            - --output-html=/reports/k8scan-report.html
            - --fail-on=CRITICAL
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: reports
              mountPath: /reports
      volumes:
        - name: reports
          emptyDir: {}
      # Optional: mount a PVC instead for persistent reports:
      # volumes:
      #   - name: reports
      #     persistentVolumeClaim:
      #       claimName: k8scan-reports
