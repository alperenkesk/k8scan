---
# Scheduled scan — runs every 6 hours
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8scan
  namespace: k8scan
  labels:
    app.kubernetes.io/name: k8scan
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: k8scan
        spec:
          serviceAccountName: k8scan
          restartPolicy: Never
          containers:
            - name: k8scan
              image: ghcr.io/alperenkeskin/k8scan:latest
              args:
                - scan
                - --output-json=/reports/k8scan-report.json
                - --output-sarif=/reports/k8scan.sarif
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: reports
                  mountPath: /reports
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: k8scan-reports
